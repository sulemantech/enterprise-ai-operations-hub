# Local development database only. Not for production use.
services:
  db:
    # PostgreSQL 16 with pgvector for procedure passage retrieval.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433, because 5432 is used by a local PostgreSQL install.
      # 127.0.0.1 keeps the database reachable only from this computer.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Test inbox: accepts any SMTP message and delivers nothing.
  # Read captured messages at http://localhost:8025.
  # Other services reach its SMTP server as mailpit:1025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:8025:8025"

  # Workflow runner. Editor at http://localhost:5678.
  n8n:
    image: n8nio/n8n:2.43.5
    environment:
      GENERIC_TIMEZONE: Australia/Sydney
      TZ: Australia/Sydney
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - mailpit

volumes:
  db-data:
  n8n-data:
