<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title description">
  <title id="title">Human governed enterprise AI operations</title>
  <desc id="description">A production target architecture for contractor evidence review. A manager uses a secure API and a LangGraph agent with an explicit harness. The agent may call allowlisted tools backed by deterministic Python rules and PostgreSQL. A human reviews and approves the exact follow-up. The API enforces approval before handing the action to an authenticated n8n worker, which sends it and records a delivery result. Identity, validation, audit, and recovery guardrails span the flow.</desc>
  <defs>
    <pattern id="paper" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".7" fill="#d7d5cd" opacity=".28"/></pattern>
    <filter id="shadow" x="-.12" y="-.12" width="1.24" height="1.32"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1d2c43" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#49617a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#31875d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family:'Segoe Print','Bradley Hand','Comic Sans MS',cursive,sans-serif; fill:#182c45 }
      .title { font-size:42px; font-weight:700 }
      .subtitle { font-size:21px; fill:#65758a }
      .stage { font-size:17px; font-weight:700; letter-spacing:2.5px; fill:#728095 }
      .cardTitle { font-size:22px; font-weight:700 }
      .cardText { font-size:17px; fill:#53637a }
      .tiny { font-size:15px; fill:#65758a }
      .white { fill:#fff }
      .gold { fill:#edc24f }
      .card { stroke-width:2.5; stroke-linejoin:round }
      .arrow { fill:none; stroke:#49617a; stroke-width:3; stroke-linecap:round; marker-end:url(#arrow) }
      .greenArrow { fill:none; stroke:#31875d; stroke-width:3.5; stroke-linecap:round; marker-end:url(#greenArrow) }
    </style>
  </defs>
